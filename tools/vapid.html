<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>알림 키 만들기</title>
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;max-width:560px;margin:40px auto;padding:0 20px;background:#FFF8F1;color:#2B2522}
button{padding:14px 22px;border:0;border-radius:14px;background:#FF7A59;color:#fff;font-size:16px;font-weight:700}
.k{font-family:Menlo,monospace;font-size:13px;background:#fff;border:1px solid #F0E6DC;border-radius:10px;padding:12px;word-break:break-all;user-select:all;margin:6px 0 18px}
p{line-height:1.6}</style></head>
<body>
<h2>🔑 아침 알림 키 만들기</h2>
<p>버튼을 한 번만 누르고, 나온 두 값을 README 설명대로 붙여넣으세요.<br><b>이 페이지는 아무 데도 전송하지 않아요.</b> (내 컴퓨터 안에서만 계산)</p>
<button id="b">키 만들기</button>
<div id="o"></div>
<script>
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("b").onclick = async () => {
  const kp = await crypto.subtle.generateKey({name:"ECDSA", namedCurve:"P-256"}, true, ["sign","verify"]);
  const pub = b64u(await crypto.subtle.exportKey("raw", kp.publicKey));
  const priv = (await crypto.subtle.exportKey("jwk", kp.privateKey)).d;
  document.getElementById("o").innerHTML = `
    <p><b>① 공개키 (VAPID_PUBLIC_KEY)</b><br>config.js 의 vapidPublicKey 와 GitHub 비밀값 VAPID_PUBLIC_KEY 두 곳에 넣기</p><div class="k">${pub}</div>
    <p><b>② 비밀키 (VAPID_PRIVATE_KEY)</b><br>GitHub 비밀값 VAPID_PRIVATE_KEY 에만 넣기 · 절대 공유 금지</p><div class="k">${priv}</div>`;
};
</script>
</body></html>
